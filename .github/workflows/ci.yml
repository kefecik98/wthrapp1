name: CI + Deploy

# CI (test) runs on every push and PR. CD runs only after the server tests
# pass on a push to main: build the image, then ship it to the rack.
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://weather:weather@localhost:5432/weather_app
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      TOMORROW_API_KEY: ci-tomorrow-key
      REVENUECAT_WEBHOOK_SECRET: ci-revenuecat-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Migration drift check: schema.prisma and the migration history must
      # describe the same database. `--exit-code` fails CI on any drift.
      - name: Check for migration drift
        run: npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - run: npm run typecheck
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # ---------------------------------------------------------------------------
  # CD step 1 — build the server image and push it to GitHub Container Registry.
  #
  # This runs on GitHub's cloud runners, NOT on the rack. That is deliberate:
  # the app VM never needs a build toolchain, never runs `npm ci`, and a deploy
  # becomes "pull a tagged artifact" instead of "rebuild and hope". It is also
  # why the app VM can be sized at 2 GB RAM rather than 4.
  #
  # Every image is tagged with the exact commit SHA, so rolling back is pinning
  # an older tag — no rebuild, no git archaeology.
  # ---------------------------------------------------------------------------
  image:
    needs: server
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Automatically provided by Actions; no PAT to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weatheralert-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/weatheralert-api:latest
          # Layer cache in GitHub Actions, so an unchanged package-lock.json
          # means the ~500 MB dependency layer is reused instead of rebuilt.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # CD step 2 — deploy to the rack.
  #
  # `runs-on: self-hosted` sends this job to the runner installed on the app VM
  # (see server/deploy/DEPLOY.md §5). That runner connects OUT to GitHub, so
  # nothing needs to reach into the home network — no port-forwarding, no public
  # IP, no SSH keys in GitHub. Same principle as the frp tunnel that serves the
  # API itself.
  #
  # `needs: image` means a failed build never reaches the rack. The client job
  # is NOT a gate: client checks failing won't block a server deploy.
  # ---------------------------------------------------------------------------
  deploy:
    needs: image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        # The rack pulls a private image. Using the job's ephemeral token means
        # there is no long-lived registry credential stored on the VM.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Deploy to app VM
        run: bash server/deploy/deploy.sh
        env:
          # The live app directory on the VM (a git clone from bootstrap).
          DEPLOY_DIR: /opt/weatheralert
          # Deploy exactly the image this run built.
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
