name: CI + Deploy

# CI (test) runs on every push and PR. CD (deploy) runs only after the server
# tests pass on a push to main — see the `deploy` job at the bottom.
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather -d weather_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://weather:weather@localhost:5432/weather_app
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      TOMORROW_API_KEY: ci-tomorrow-key
      REVENUECAT_WEBHOOK_SECRET: ci-revenuecat-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Migration drift check: schema.prisma and the migration history must
      # describe the same database. `--exit-code` fails CI on any drift.
      - name: Check for migration drift
        run: npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - run: npm run typecheck
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # ---------------------------------------------------------------------------
  # CD: deploy the server to the rack.
  #
  # Runs ONLY when:
  #   - the `server` test job above succeeded  (needs: server), AND
  #   - the trigger is a push (not a PR) to the main branch  (if: ...).
  # So a red test suite, or a PR, never deploys. The client job is NOT a
  # gate here — client checks failing won't block a server deploy.
  #
  # `runs-on: self-hosted` sends this job to the runner installed on the app
  # VM (see server/deploy/DEPLOY.md §8). That runner connects OUT to GitHub,
  # so nothing needs to reach into the home network — no port-forwarding, no
  # public IP, no SSH keys in GitHub. The deploy is then just local commands
  # on the VM, driven by server/deploy/deploy.sh.
  #
  # The `vars.DEPLOY_ENABLED == 'true'` guard is the master on-switch. Until
  # you set that repo variable (Settings → Secrets and variables → Actions →
  # Variables), this job is SKIPPED — so before the runner exists it doesn't
  # sit queued forever waiting for one. Flip it on only after §8 is done.
  # ---------------------------------------------------------------------------
  deploy:
    needs: server
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to app VM
        run: bash server/deploy/deploy.sh
        env:
          # The live app directory on the VM (a git clone from bootstrap).
          DEPLOY_DIR: /opt/weatheralert
