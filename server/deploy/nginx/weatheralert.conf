# Nginx site for the WeatherAlert API.
#
# Install:
#   sudo cp deploy/nginx/weatheralert.conf /etc/nginx/sites-available/weatheralert
#   sudo ln -s /etc/nginx/sites-available/weatheralert /etc/nginx/sites-enabled/weatheralert
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue a certificate:
#   sudo certbot --nginx -d api.example.com
#
# Certbot will rewrite the listen 443 block below and inject the
# `ssl_certificate` / `ssl_certificate_key` lines automatically.

# Replace api.example.com with the real hostname before deploying.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Certbot HTTP-01 challenge path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Force everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # ssl_certificate / ssl_certificate_key lines are managed by certbot.

    # Fastify is configured with bodyLimit: 1 MiB. Match it here so Nginx
    # rejects oversize requests before they reach Node.
    client_max_body_size 1m;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Reasonable timeouts. The RevenueCat webhook + Tomorrow.io upstream
    # calls finish well under this; raise only if you see 504s in logs.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Fastify needs to see the real client info for logging + rate
        # limiting decisions made downstream.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
